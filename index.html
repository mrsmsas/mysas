<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal MY MRSMSAS</title>

    <!-- ===== IKON & "ADD TO HOME SCREEN" ===== -->
    <!-- Favicon (tab pelayar) -->
    <link rel="icon" href="icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48x48.png">

    <!-- iOS: ikon apabila "Add to Home Screen" -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MRSMSAS">

    <!-- Android/Chrome: ikon PWA + warna tema -->
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#14b8a6">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Memuatkan Tailwind CSS untuk penggayaan pantas dan moden -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuatkan Font Awesome untuk ikon yang mudah digunakan dan pelbagai -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Memuatkan Google Fonts (Inter) untuk tipografi yang bersih -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6', // Warna tema utama (Teal)
                            600: '#0d9488',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Gaya tambahan untuk animasi hover pada ikon aplikasi */
        .app-icon-container {
            transition: all 0.2s ease-in-out;
        }
        .app-icon-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
    <!-- Bar Navigasi Atas -->
    <nav class="bg-white shadow-sm border-b border-gray-200 h-16 flex-shrink-0 z-10 relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex justify-between items-center">

            <!-- Bahagian Kiri: Logo/Tajuk -->
            <div class="flex items-center space-x-4">
                <div class="flex items-center">
                    <img src="icons/icon-192.png" alt="Logo MRSMSAS" class="w-9 h-9 rounded-lg mr-3 shadow-sm">
                    <h1 id="header-title" class="text-xl font-bold text-gray-900 tracking-tight">Portal Intranet MRSMSAS</h1>
                </div>
            </div>
            <!-- Bahagian Kanan: Profil/Tetapan Ringkas -->
            <div class="flex items-center space-x-3">
                <button class="text-gray-400 hover:text-gray-600 p-2 rounded-full hover:bg-gray-100 transition-colors">
                    <i class="fas fa-bell"></i>
                </button>
                <div class="w-9 h-9 rounded-full bg-brand-100 flex items-center justify-center text-brand-600 font-semibold border border-brand-200 cursor-pointer">
                    Ai
                </div>
            </div>
        </div>
    </nav>
    <!-- Kawasan Utama: Papan Pemuka dengan Grid Ikon -->
    <main id="dashboard-view" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">




        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-800">Selamat Datang</h2>
            <p class="text-gray-500 mt-1">Portal Istudent MRSM SAS.</p>
        </div>

        <!-- Bekas Grid untuk Ikon Aplikasi -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6" id="app-grid">
            <!-- Ikon akan dijana di sini oleh JavaScript -->
        </div>

    </main>
             <!-- FOOTER BAHARU: Unit ICT MRSMSAS 2026 -->
    <footer class="bg-white border-t border-gray-200 mt-auto py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm font-medium text-gray-500">
            &copy; 2026 Unit ICT MRSMSAS. Hak Cipta Terpelihara.
        </div>
    </footer>
    <!-- Logik Aplikasi -->
    <script>
        // Data Konfigurasi: Senarai 10 Sistem Aplikasi anda
        // Anda boleh menukar tajuk, warna, ikon, dan pautan web (url) mengikut keperluan anda
        const systemApps = [
            {
                id: 'sys1',
                title: 'eTahmidi',
                icon: 'fa-solid fa-mobile-screen',
                color: 'bg-blue-500',
                textColor: 'text-blue-500',
                bgColor: 'bg-blue-50',
                url: 'https://script.google.com/macros/s/AKfycbwu5AjSujstohnlw4x2Ob_JIYUay2YW7FwNXiYdyoqbNU1ucP-YBplwM9BmTU_rx8Ej/exec' // Gantikan dengan URL sebenar
            },
             {
                id: 'sys1',
                title: 'eTahmidi',
                icon: 'fa-solid fa-file-pen',
                color: 'bg-blue-500',
                textColor: 'text-blue-500',
                bgColor: 'bg-blue-50',
                url: 'https://mrsmsultanazlanshah.edu.my/epelajar/login.asp' // Gantikan dengan URL sebenar
            },
           
            {
                id: 'sys9',
                title: 'OneMRSM',
                icon: 'fa-building',
                color: 'bg-orange-500',
                textColor: 'text-orange-500',
                bgColor: 'bg-orange-50',
                url: 'https://onemrsm.com/mymrsm/frmlogmasukpelajar.aspx'
          
            }
        ];
        // Fungsi untuk menjana Grid Ikon Aplikasi secara dinamik
        function renderDashboard() {
            const gridContainer = document.getElementById('app-grid');
            gridContainer.innerHTML = ''; // Bersihkan container
            systemApps.forEach(app => {
                // Buat elemen kad (butang) untuk setiap aplikasi
                const card = document.createElement('button');
                card.className = 'app-icon-container flex flex-col items-center justify-center p-6 bg-white rounded-2xl shadow-sm border border-gray-100 hover:border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 group';

                // Tambah data atribut untuk pengecaman
                card.dataset.appId = app.id;

                // Struktur dalam kad: Ikon + Tajuk
                card.innerHTML = `
                    <div class="w-16 h-16 rounded-2xl ${app.bgColor} ${app.textColor} flex items-center justify-center mb-4 transition-transform group-hover:scale-110 duration-200">
                        <i class="fas ${app.icon} text-3xl"></i>
                    </div>
                    <span class="text-sm font-semibold text-gray-700 text-center leading-tight group-hover:text-brand-600 transition-colors">
                        ${app.title}
                    </span>
                `;
                // Tambah event listener apabila ikon diklik - Buka di tab baharu untuk elak sekatan
                card.addEventListener('click', () => {
                    window.open(app.url, '_blank', 'noopener,noreferrer');
                });
                // Masukkan ke dalam grid
                gridContainer.appendChild(card);
            });
        }
        // Jalankan fungsi awal semasa halaman siap dimuatkan
        window.addEventListener('DOMContentLoaded', () => {
            renderDashboard();
        });
    </script>
</body>
</html>
